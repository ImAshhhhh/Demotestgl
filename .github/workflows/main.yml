name: macOS Browser Remote Desktop

on:
  workflow_dispatch:
  push:

jobs:
  macos-remote:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable macOS VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw password \
            -restart -agent \
            -privs -all

      - name: Verify VNC Port
        run: |
          echo "Checking VNC status..."
          
          lsof -iTCP -sTCP:LISTEN | grep 5900 || true
          
          netstat -an | grep 5900 || true

      - name: Launch macOS GUI Apps
        run: |
          open -a Finder
          open -a Safari
          open -a TextEdit
          
          osascript -e 'tell application "Finder" to activate'
          
          sleep 20

      - name: Take Desktop Screenshot
        run: |
          screencapture desktop.png
          
          ls

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: desktop.png

      - name: Clone noVNC
        run: |
          git clone https://github.com/novnc/noVNC.git
          
          git clone https://github.com/novnc/websockify.git

      - name: Start noVNC Server
        run: |
          cd noVNC
          
          chmod +x utils/novnc_proxy
          
          nohup python3 utils/novnc_proxy \
            --vnc localhost:5900 \
            --listen 6080 \
            > ../novnc.log 2>&1 &
          
          sleep 15
          
          cat ../novnc.log || true

      - name: Install Cloudflare Tunnel
        run: |
          brew install cloudflared

      - name: Expose Browser Desktop
        run: |
          nohup cloudflared tunnel \
            --url http://localhost:6080 \
            > tunnel.log 2>&1 &
          
          sleep 20
          
          cat tunnel.log

      - name: Keep Runner Alive
        run: |
          echo "Remote desktop active..."
          
          sleep 3600

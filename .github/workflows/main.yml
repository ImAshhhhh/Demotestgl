name: macOS Browser Remote Desktop

on:
  workflow_dispatch:
  push:

jobs:
  macos-remote:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable macOS VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw password \
            -restart -agent \
            -privs -all

      - name: Verify VNC Port
        run: |
          echo "Checking VNC..."
          
          lsof -iTCP -sTCP:LISTEN | grep 5900 || true
          
          netstat -an | grep 5900 || true

      - name: Launch GUI Apps
        run: |
          open -a Finder
          open -a Safari
          open -a TextEdit
          
          osascript -e 'tell application "Finder" to activate'
          
          sleep 20

      - name: Take Screenshot
        run: |
          screencapture desktop.png
          
          ls

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: desktop.png

      - name: Clone noVNC
        run: |
          git clone https://github.com/novnc/noVNC.git
          
          git clone https://github.com/novnc/websockify.git

      - name: Start noVNC
        run: |
          cd noVNC

          chmod +x utils/novnc_proxy

          nohup ./utils/novnc_proxy \
            --vnc localhost:5900 \
            --listen 6080 \
            > ../novnc.log 2>&1 &

          sleep 15

          cat ../novnc.log || true

      - name: Install Cloudflare Tunnel
        run: |
          brew install cloudflared

      - name: Expose noVNC
        run: |
          nohup cloudflared tunnel \
            --url http://localhost:6080 \
            > tunnel.log 2>&1 &

          sleep 20

          cat tunnel.log

      - name: Show Browser URL
        run: |
          echo ""
          echo "Open the Cloudflare URL above in your browser"
          echo "Then connect using password: password"

      - name: Keep Runner Alive
        run: |
          echo "Keeping macOS desktop online..."
          
          sleep 3600

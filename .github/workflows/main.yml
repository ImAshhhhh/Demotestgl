name: macOS Full Desktop noVNC

on:
  workflow_dispatch:
  push:

jobs:
  macos-remote:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Test User
        run: |
          sudo sysadminctl -addUser testuser \
            -password testpass \
            -home /Users/testuser || true

      - name: Enable Remote Management
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -users testuser \
            -privs -all \
            -restart -agent

          sleep 10

      - name: Force Console VNC
        run: |
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement \
            VNCAlwaysStartOnConsole -bool true

          sudo defaults write /Library/Preferences/com.apple.RemoteManagement \
            RestoreMachineState -bool true

          sudo launchctl unload -w \
            /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

          sudo launchctl load -w \
            /System/Library/LaunchDaemons/com.apple.screensharing.plist

          sudo launchctl kickstart -k system/com.apple.screensharing

          sleep 15

      - name: Verify VNC Port
        run: |
          echo "Checking VNC..."

          lsof -iTCP -sTCP:LISTEN | grep 5900 || true

          netstat -an | grep 5900 || true

      - name: Wake Real GUI Session
        run: |
          sudo launchctl asuser "$(id -u runner)" open -a Finder

          sudo launchctl asuser "$(id -u runner)" open -a Safari

          sudo launchctl asuser "$(id -u runner)" open -a TextEdit

          osascript -e 'tell application "Finder" to activate'

          caffeinate -u -t 3600

          sleep 20

      - name: Set Desktop Wallpaper
        run: |
          osascript <<EOF
          tell application "Finder"
            set desktop picture to POSIX file "/System/Library/Desktop Pictures/Solid Colors/Blue.png"
          end tell
          EOF

      - name: Screenshot Test
        run: |
          screencapture desktop.png

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: desktop.png

      - name: Clone noVNC
        run: |
          git clone https://github.com/novnc/noVNC.git

      - name: Start noVNC
        run: |
          cd noVNC

          chmod +x utils/novnc_proxy

          nohup ./utils/novnc_proxy \
            --listen 6080 \
            --vnc localhost:5900 \
            > ../novnc.log 2>&1 &

          sleep 15

          cat ../novnc.log || true

      - name: Install Cloudflare Tunnel
        run: |
          brew install cloudflared

      - name: Expose Browser Desktop
        run: |
          nohup cloudflared tunnel \
            --url http://localhost:6080 \
            > tunnel.log 2>&1 &

          sleep 20

          cat tunnel.log

      - name: Show Login Info
        run: |
          echo ""
          echo "Open the Cloudflare URL shown above"
          echo ""
          echo "Then open:"
          echo "/vnc.html"
          echo ""
          echo "Username: testuser"
          echo "Password: testpass"

      - name: Keep Runner Alive
        run: |
          echo "Keeping desktop alive..."

          sleep 3600

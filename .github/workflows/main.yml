name: macOS Screenshot Commit

on:
  push:

jobs:
  screenshot:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Take Screenshot
        run: |
          mkdir -p screenshots
          screencapture screenshots/macos-desktop.png

      - name: Commit Screenshot
        run: |
          git add screenshots/macos-desktop.png
          
          git commit -m "Add macOS screenshot" || echo "No changes"
          
          git push

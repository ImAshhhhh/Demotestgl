name: macOS Browser Desktop

on:
  workflow_dispatch:
  push:

jobs:
  browser-desktop:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable macOS VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw password \
            -restart -agent \
            -privs -all

      - name: Install noVNC
        run: |
          brew install novnc websockify

      - name: Start GUI Apps
        run: |
          open -a Finder
          open -a Safari
          
          sleep 15

      - name: Start noVNC
        run: |
          nohup /opt/homebrew/opt/novnc/bin/novnc_server \
            --vnc localhost:5900 \
            --listen 6080 \
            > novnc.log 2>&1 &

          sleep 10

          cat novnc.log || true

      - name: Install cloudflared
        run: |
          brew install cloudflared

      - name: Expose noVNC to Internet
        run: |
          nohup cloudflared tunnel \
            --url http://localhost:6080 \
            > tunnel.log 2>&1 &

          sleep 15

          cat tunnel.log

      - name: Screenshot
        run: |
          screencapture desktop.png

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: desktop.png

      - name: Keep Runner Alive
        run: |
          sleep 3600

name: macOS VNC Test

on:
  push:
  workflow_dispatch:

jobs:
  vnc-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable macOS Screen Sharing (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw password \
            -restart -agent \
            -privs -all

      - name: Verify ARDAgent
        run: |
          ps aux | grep ARDAgent || true

      - name: Check VNC Port
        run: |
          echo "Checking port 5900..."
          
          lsof -iTCP -sTCP:LISTEN | grep 5900 || true
          
          netstat -an | grep 5900 || true

      - name: Install Cloudflare Tunnel
        run: |
          brew install cloudflared

      - name: Start Cloudflare TCP Tunnel
        run: |
          nohup cloudflared tunnel --url tcp://localhost:5900 > tunnel.log 2>&1 &
          
          sleep 15
          
          cat tunnel.log || true

      - name: Open Safari
        run: |
          open -a Safari
          sleep 5

      - name: Take Screenshot
        run: |
          mkdir -p screenshots
          
          screencapture screenshots/macos-vnc-test.png
          
          ls screenshots

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: macos-vnc-test
          path: screenshots/macos-vnc-test.png

      - name: Keep Runner Alive
        run: |
          echo "Runner alive for VNC testing..."
          sleep 1200
